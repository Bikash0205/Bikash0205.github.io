<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapPurge - 30-Second Screenshot Triage</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #090a0f;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 560px;
      background: #141721;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 48px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .logo-container {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      border-radius: 24px;
      background: linear-gradient(135deg, #18181D 0%, #0A0A0D 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -2px;
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(239, 68, 68, 0.25);
    }
    h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.8px; margin-bottom: 12px; }
    p { color: #94a3b8; font-size: 16px; line-height: 1.5; margin-bottom: 30px; }
    .btn-group { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .btn {
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 22px;
      border-radius: 12px;
      transition: all 0.2s ease;
    }
    .btn-primary { background: #ef4444; color: #ffffff; }
    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: #cbd5e1; border: 1px solid rgba(255, 255, 255, 0.12); }
    footer { margin-top: 36px; font-size: 13px; color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <img src="icon.png" width="96" height="96" alt="SnapPurge Logo" style="border-radius: 24px; box-shadow: 0 10px 25px rgba(239, 68, 68, 0.25); margin-bottom: 20px;">
    <h1>SnapPurge</h1>
    <p>30-second daily screenshot triage. Keep your camera roll clean and reclaim storage with 100% on-device privacy.</p>
    <div class="btn-group">
      <a href="privacy-policy.html" class="btn btn-secondary">Privacy Policy</a>
      <a href="app-ads.txt" class="btn btn-secondary">app-ads.txt</a>
    </div>
  </div>
  <footer>&copy; 2026 SnapPurge. Developed by Bikash. All rights reserved.</footer>
</body>
</html>
